# Mirrors the subset of Home Assistant core's ruff config that matters for a
# custom integration.
target-version = "py313"
line-length = 88

[lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # import sorting
    "UP",               # pyupgrade
    "B",                # bugbear
    "ASYNC",            # async pitfalls, e.g. blocking calls in the event loop
    "RUF",
    "SIM",
    "D",                # docstrings, which hassfest-adjacent tooling expects
]
ignore = [
    "D203", "D213",
]

[lint.pydocstyle]
convention = "pep257"

[lint.per-file-ignores]
# Test names describe themselves; forcing a docstring on top of a name like
# test_year_inference_for_partial_dates adds nothing.
"tests/*" = ["D100", "D103"]
# Standalone developer tools, not part of the component.
"probe_v2.py" = ["D103"]
"scrub_har.py" = ["D103"]
